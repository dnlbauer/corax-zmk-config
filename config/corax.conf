CONFIG_ZMK_KEYBOARD_NAME="Corax"

# EC11 encoders are enabled by devicetree, but the trigger mode defaults to NONE
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display is enabled by the nice_view shield.
# Uncomment to use the built-in status screen instead of the nice!view widget
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
#CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
#CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

CONFIG_ZMK_SLEEP=y
# enter deepsleep after 3600000 ms (1hr)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Increase bluetooth power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# work around Windows not showing the keyboard battery
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# report the right (peripheral) half's battery level to the host (central only)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# required for &msc encoder scrolling
CONFIG_ZMK_POINTING=y

# hi-res encoder scrolling on hosts that support HID resolution multipliers (central only)
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
